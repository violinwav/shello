name: CI

# Lints, builds and tests the app and ShelloKit on every pull request and on main.
# Compiler warnings are errors in Shello's own targets (docs/spec/STACK.md section 11). That is set in
# Configurations/Project.xcconfig and Package.swift, not here: on the command line it would also reach
# package dependencies, which Xcode builds with warnings suppressed, and the compiler rejects
# -warnings-as-errors together with -suppress-warnings.
# No signing: simulator builds sign to run locally, the device build is unsigned.

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=26.5

jobs:
  macos:
    runs-on: macos-26
    # A cold vendor build adds about 10 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel App UITests Packages/ShelloKit

      # libssh and OpenSSL, built from verified source by Vendor/build.sh (Vendor/README.md).
      # Cached by the files that determine the build and by the Xcode version, so they are
      # rebuilt only when one of those changes.
      - name: Vendored libraries cache key
        id: vendor-key
        env:
          INPUTS: ${{ hashFiles('Vendor/build.sh', 'Vendor/lib.sh', 'Vendor/sources.sha256', 'Vendor/keys/**', 'Vendor/openssl/**', 'Vendor/libssh/**', 'Vendor/patches/**') }}
        run: echo "key=vendor-$(xcodebuild -version | shasum -a 256 | cut -c1-16)-$INPUTS" >> "$GITHUB_OUTPUT"

      - name: Restore vendored libraries
        id: vendor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/build/xcframeworks
          key: ${{ steps.vendor-key.outputs.key }}

      - name: Build vendored libraries
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          command -v gpgv >/dev/null || brew install gnupg
          command -v cmake >/dev/null || brew install cmake
          Vendor/build.sh

      # Saved straight away, so that a later failing step does not throw the build away.
      - name: Save vendored libraries
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/build/xcframeworks
          key: ${{ steps.vendor-key.outputs.key }}

      - name: Unit and UI tests
        run: >-
          xcodebuild test -quiet
          -project Shello.xcodeproj -scheme Shello
          -destination "$SIMULATOR"

      # Enhanced Security adds an arm64e slice, which every linked target must have.
      - name: Device build (arm64 and arm64e)
        run: |
          xcodebuild build -quiet \
            -project Shello.xcodeproj -scheme Shello -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          lipo build/Build/Products/Release-iphoneos/Shello.app/Shello -verify_arch arm64 arm64e
