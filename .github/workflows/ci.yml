name: CI

# Lints, builds and tests the app and ShelloKit on every pull request and on main.
# Compiler warnings are errors here (docs/spec/STACK.md section 11).
# No signing: simulator builds sign to run locally, the device build is unsigned.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=26.5
  STRICT: SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --parallel App UITests Packages/ShelloKit

      - name: Unit and UI tests
        run: >-
          xcodebuild test -quiet
          -project Shello.xcodeproj -scheme Shello
          -destination "$SIMULATOR"
          $STRICT

      # Enhanced Security adds an arm64e slice, which every linked target must have.
      - name: Device build (arm64 and arm64e)
        run: |
          xcodebuild build -quiet \
            -project Shello.xcodeproj -scheme Shello -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO $STRICT
          lipo build/Build/Products/Release-iphoneos/Shello.app/Shello -verify_arch arm64 arm64e
