name: Graphify

# Rebuilds the code knowledge graph on every push to main and attaches
# graph.html, graph.json and GRAPH_REPORT.md to the run as an artifact.
# No LLM, no API key: code is parsed with tree-sitter and Markdown only by
# its headings. graphify's semantic pass over documents is skipped.
# .graphifyignore keeps the vendored skills in .claude/ out of the graph.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRAPHIFY_VERSION: "0.9.88"

jobs:
  graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false

      - name: Install graphify
        run: |
          uv tool install "graphifyy==${GRAPHIFY_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Build the code graph
        run: graphify update .

      - uses: actions/upload-artifact@v7
        with:
          name: graphify-graph
          path: |
            graphify-out/graph.html
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 30
