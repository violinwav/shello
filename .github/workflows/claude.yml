name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when @claude is mentioned, and only for the repo owner/collaborators
    # (the repo is public, so strangers must not be able to spend your quota).
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The skills in .claude/skills load from the checkout; graphify needs its CLI.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false

      - name: Install graphify and build the code graph
        env:
          GRAPHIFY_VERSION: "0.9.88"
        run: |
          uv tool install "graphifyy==${GRAPHIFY_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"
          "$(uv tool dir --bin)/graphify" update .

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Pro/Max subscription: create the token with `claude setup-token`
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Or, with an Anthropic API key instead, replace the line above with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # graphify queries and refreshes the graph; the issue-tracker skills
          # (/to-spec, /to-tickets, /triage) use `gh issue` and `gh label list`.
          claude_args: >-
            --allowedTools "Bash(graphify query:*),Bash(graphify path:*),Bash(graphify explain:*),Bash(graphify update:*),Bash(gh issue:*),Bash(gh label list:*)"
          # Optional, appended to the line above:
          #   --max-turns 10
