## -*- mode: perl; -*-
## Shello's OpenSSL targets, loaded with `Configure --config=`.
##
## The iOS targets copy upstream's ios64-xcrun and iossimulator-arm64-xcrun
## (Configurations/15-ios.conf) and add arm64e, which upstream has no target for.
## Vendor/build.sh adds the deployment target and the hardening flags.
## shello-darwin-arm64e exists only for Vendor/test-openssl-arm64e.sh: macOS runs
## arm64e with pointer authentication enforced, the iOS Simulator does not.

my %targets = (
    "shello-ios-arm64" => {
        inherit_from     => [ "ios-common" ],
        CC               => "xcrun -sdk iphoneos cc",
        cflags           => add("-arch arm64 -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
    "shello-ios-arm64e" => {
        inherit_from     => [ "ios-common" ],
        CC               => "xcrun -sdk iphoneos cc",
        cflags           => add("-arch arm64e -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
    "shello-iossimulator-arm64" => {
        inherit_from     => [ "ios-common" ],
        CC               => "xcrun -sdk iphonesimulator cc",
        cflags           => add("-arch arm64 -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
    # Upstream's darwin64-arm64 (Configurations/10-main.conf) with -arch arm64e.
    "shello-darwin-arm64e" => {
        inherit_from     => [ "darwin-common" ],
        CFLAGS           => add("-Wall"),
        cflags           => add("-arch arm64e"),
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
);
